name: Build and publish Docker image on one platform

on:
    workflow_call:
        inputs:
            runner:
                required: true
                type: string
            platform:
                required: true
                type: string
            suffix:
                required: false
                type: string

jobs:
    build-and-push:
        runs-on: ${{ inputs.runner }}

        permissions:
            packages: write

        steps:
            - name: Docker meta
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch,suffix=${{ inputs.suffix }}
                      type=semver,pattern={{version}},suffix=${{ inputs.suffix }}
                      type=semver,pattern={{major}}.{{minor}},suffix=${{ inputs.suffix }}
                      type=semver,pattern={{major}},suffix=${{ inputs.suffix }}

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: VERSION=${{ steps.meta.outputs.version }}
                  platforms: ${{ inputs.platform }}
